name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dependency vulnerability review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: paper-1.21.11
            java: "21"
            minecraft-baseline: "1.21.11"
            compile-task: paper121Compile
            boot-task: paper121BootSmoke
            boot-smoke: "true"
          - platform: paper-26.1
            java: "25"
            minecraft-baseline: "26.1.2"
            compile-task: paper261Compile
            boot-task: paper261BootSmoke
            boot-smoke: "true"
          - platform: paper-26.2
            java: "25"
            minecraft-baseline: "26.2"
            compile-task: paper262Compile
            boot-task: ""
            boot-smoke: "false"
    env:
      CLOUDISLANDS_CI_PLATFORM: ${{ matrix.platform }}
      CLOUDISLANDS_MINECRAFT_BASELINE: ${{ matrix.minecraft-baseline }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25 build launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate and configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build verifyMinecraftVersionMatrix verifyAdapterPackaging apiCompatibilityCheck protocolCompatibilityCheck distBundle distAddonBundle distChecksums distSbom distProvenance verifyReleaseSecurityGate --no-daemon

      - name: Matrix compile
        run: ./gradlew ${{ matrix.compile-task }} --no-daemon

      - name: Boot smoke
        if: matrix.boot-smoke == 'true'
        run: ./gradlew ${{ matrix.boot-task }} velocityBootSmoke --no-daemon

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudislands-dist-${{ matrix.platform }}-java${{ matrix.java }}
          path: |
            build/dist/*.zip
            build/dist/checksums-sha256.txt
            build/dist/cloudislands-sbom.cdx.json
            build/dist/provenance.json
            build/dist/plugins/*.jar
            build/dist/addons/*.jar
          if-no-files-found: error

  version-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Java 25 build launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate and configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify all Paper compile and stable boot targets
        run: ./gradlew verifyMinecraftVersionMatrix compileAllMinecraftVersions bootSmokeAllStableMinecraftVersions --no-daemon

  container-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            dockerfile: deploy/docker/core.Dockerfile
          - image: paper
            dockerfile: deploy/docker/paper.Dockerfile
          - image: velocity
            dockerfile: deploy/docker/velocity.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/cloudislands-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cloudislands-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=cloudislands-${{ matrix.image }}
