name: CloudIslandsSatis
main: kr.seungmin.satisskyfactory.SatisSkyFactoryPlugin
version: ${projectVersion}
description: Official CloudIslands Satis addon without a SuperiorSkyblock2 runtime dependency
api-version: "${paperApiBaseline}"
load: POSTWORLD
prefix: CloudIslandsSatis
depend: [CloudIslands]
softdepend: [Vault, PlaceholderAPI]
author: LeeSeungmin
website: "mailto:admin@lunaf.kr"
commands:
  factory:
    description: CloudIslands Satis command
    usage: /factory help
    permission: satisskyfactory.use
  sfactory:
    description: CloudIslands Satis command
    usage: /sfactory help
    permission: satisskyfactory.use
permissions:
  satisskyfactory.use:
    default: true
  satisskyfactory.command.main:
    default: true
  satisskyfactory.command.status:
    default: true
  satisskyfactory.command.machines:
    default: true
  satisskyfactory.command.storage:
    default: true
  satisskyfactory.command.deposit:
    default: true
  satisskyfactory.command.withdraw:
    default: true
  satisskyfactory.command.market:
    default: true
  satisskyfactory.command.sell:
    default: true
  satisskyfactory.command.contracts:
    default: true
  satisskyfactory.command.research:
    default: true
  satisskyfactory.command.node:
    default: true
  satisskyfactory.command.repair:
    default: true
  satisskyfactory.admin:
    default: op
  satisskyfactory.admin.reload:
    default: op
  satisskyfactory.admin.features:
    default: op
  satisskyfactory.admin.integration:
    default: op
  satisskyfactory.admin.doctor:
    default: op
  satisskyfactory.admin.database:
    default: op
  satisskyfactory.admin.runtime:
    default: op
  satisskyfactory.admin.routes:
    default: op
  satisskyfactory.admin.support:
    default: op
  satisskyfactory.admin.state:
    default: op
  satisskyfactory.admin.migration:
    default: op
  satisskyfactory.admin.give:
    default: op
  satisskyfactory.admin.giveitem:
    default: op
  satisskyfactory.admin.research:
    default: op
  satisskyfactory.admin.maintenance:
    default: op
  satisskyfactory.admin.nodes:
    default: op
  satisskyfactory.admin.debug:
    default: op
  satisskyfactory.debug:
    default: op
