images:
  core:
    repository: ghcr.io/m-lunafarm/cloudislands-core
    tag: latest
  velocity:
    repository: ghcr.io/m-lunafarm/cloudislands-velocity
    tag: latest
  paper:
    repository: ghcr.io/m-lunafarm/cloudislands-paper
    tag: latest
  postgres:
    repository: postgres
    tag: "16"
  redis:
    repository: redis
    tag: "7"
  objectStorage:
    repository: minio/minio
    tag: latest

secrets:
  existingSecret: cloudislands-secrets
  databasePasswordKey: database-password
  redisPasswordKey: redis-password
  storageAccessKeyKey: storage-access-key
  storageSecretKeyKey: storage-secret-key
  coreTokenKey: core-token
  adminTokenKey: admin-token
  forwardingSecretKey: forwarding-secret

core:
  replicas: 1
  port: 8443
  adminBind: "127.0.0.1"
  adminPort: 9443
  adminListenerEnabled: true
  # Required for Paper/Velocity admin clients that use the internal ClusterIP Core service.
  publicAdminApiEnabled: true
  # Explicit current operator profile; unlike *, future permissions are not auto-granted.
  adminPermissions: "node-drain,node-undrain,node-kick,node-shutdown,island-activate,island-deactivate,island-migrate,island-snapshot,island-restore,island-quarantine,island-delete,island-repair,island-teleport,island-manage,audit-read,job-manage,route-manage,cache-clear,migration-manage,player-manage,economy-manage,template-manage,moderation-manage"
  allowInsecurePublicHttp: false

velocity:
  replicas: 1
  port: 25565

lobby:
  replicas: 1
  nodeId: lobby-01
  serverName: lobby
  storage: 10Gi

islandPaper:
  replicas: 2
  pool: island
  serverNamePrefix: island
  storage: 20Gi

postgres:
  database: cloudislands
  username: cloudislands
  storage: 20Gi

redis:
  storage: 5Gi

objectStorage:
  bucket: cloudislands
  storage: 50Gi
