name: cloudislands

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudislands
      POSTGRES_USER: cloudislands
      POSTGRES_PASSWORD_FILE: /run/secrets/cloudislands_database_password
    secrets:
      - cloudislands_database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudislands -d cloudislands"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/cloudislands_redis_password)\""]
    secrets:
      - cloudislands_redis_password
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/cloudislands_redis_password)\" ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/cloudislands_storage_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/cloudislands_storage_secret_key
    secrets:
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "$$(cat /run/secrets/cloudislands_storage_access_key)"
        "$$(cat /run/secrets/cloudislands_storage_secret_key)" &&
        mc mb --ignore-existing local/cloudislands
    secrets:
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
    networks:
      - backend

  core-1:
    image: ${CLOUDISLANDS_CORE_IMAGE:-cloudislands-core:local}
    build:
      context: ../..
      dockerfile: deploy/docker/core.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CI_RUNTIME_MODE: production
      CI_BIND: 0.0.0.0
      CI_PORT: "8443"
      CI_ADMIN_BIND: ${CI_ADMIN_BIND:-127.0.0.1}
      CI_ADMIN_PORT: ${CI_ADMIN_PORT:-9443}
      CI_ADMIN_LISTENER_ENABLED: ${CI_ADMIN_LISTENER_ENABLED:-true}
      # Paper/Velocity admin clients use the internal core-api listener.
      CI_PUBLIC_ADMIN_API_ENABLED: ${CI_PUBLIC_ADMIN_API_ENABLED:-true}
      CI_ADMIN_PERMISSIONS: ${CI_ADMIN_PERMISSIONS:-node-drain,node-undrain,node-kick,node-shutdown,island-activate,island-deactivate,island-migrate,island-snapshot,island-restore,island-quarantine,island-delete,island-repair,island-teleport,island-manage,audit-read,job-manage,route-manage,cache-clear,migration-manage,player-manage,economy-manage,template-manage,moderation-manage}
      CI_ALLOW_INSECURE_PUBLIC_HTTP: "true"
      CI_AUTH_MODE: TOKEN_REQUIRED
      CI_REQUIRE_MTLS: "false"
      CI_REPOSITORY_MODE: JDBC
      CI_DATABASE_TYPE: POSTGRESQL
      CI_JDBC_URL: jdbc:postgresql://postgres:5432/cloudislands
      CI_DB_USERNAME: cloudislands
      CI_DB_PASSWORD_FILE: /run/secrets/cloudislands_database_password
      CI_DB_AUTO_SCHEMA: "true"
      CI_DB_FALLBACK_ENABLED: "false"
      CI_REDIS_URI: redis://redis:6379
      CI_REDIS_PASSWORD_FILE: /run/secrets/cloudislands_redis_password
      CI_STORAGE_TYPE: S3
      CI_STORAGE_ENDPOINT: http://minio:9000
      CI_STORAGE_BUCKET: cloudislands
      CI_STORAGE_ACCESS_KEY_FILE: /run/secrets/cloudislands_storage_access_key
      CI_STORAGE_SECRET_KEY_FILE: /run/secrets/cloudislands_storage_secret_key
      CI_CORE_TOKEN_FILE: /run/secrets/cloudislands_core_token
      CI_ADMIN_TOKEN_FILE: /run/secrets/cloudislands_admin_token
      JAVA_OPTS: ${CLOUDISLANDS_CORE_JAVA_OPTS:--Xms128m -Xmx768m}
    secrets:
      - cloudislands_database_password
      - cloudislands_redis_password
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
      - cloudislands_core_token
      - cloudislands_admin_token
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  core-2:
    image: ${CLOUDISLANDS_CORE_IMAGE:-cloudislands-core:local}
    build:
      context: ../..
      dockerfile: deploy/docker/core.Dockerfile
    restart: unless-stopped
    depends_on:
      core-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CI_RUNTIME_MODE: production
      CI_BIND: 0.0.0.0
      CI_PORT: "8443"
      CI_ADMIN_BIND: ${CI_ADMIN_BIND:-127.0.0.1}
      CI_ADMIN_PORT: ${CI_ADMIN_PORT:-9443}
      CI_ADMIN_LISTENER_ENABLED: ${CI_ADMIN_LISTENER_ENABLED:-true}
      # Paper/Velocity admin clients use the internal core-api listener.
      CI_PUBLIC_ADMIN_API_ENABLED: ${CI_PUBLIC_ADMIN_API_ENABLED:-true}
      CI_ADMIN_PERMISSIONS: ${CI_ADMIN_PERMISSIONS:-node-drain,node-undrain,node-kick,node-shutdown,island-activate,island-deactivate,island-migrate,island-snapshot,island-restore,island-quarantine,island-delete,island-repair,island-teleport,island-manage,audit-read,job-manage,route-manage,cache-clear,migration-manage,player-manage,economy-manage,template-manage,moderation-manage}
      CI_ALLOW_INSECURE_PUBLIC_HTTP: "true"
      CI_AUTH_MODE: TOKEN_REQUIRED
      CI_REQUIRE_MTLS: "false"
      CI_REPOSITORY_MODE: JDBC
      CI_DATABASE_TYPE: POSTGRESQL
      CI_JDBC_URL: jdbc:postgresql://postgres:5432/cloudislands
      CI_DB_USERNAME: cloudislands
      CI_DB_PASSWORD_FILE: /run/secrets/cloudislands_database_password
      CI_DB_AUTO_SCHEMA: "false"
      CI_DB_FALLBACK_ENABLED: "false"
      CI_REDIS_URI: redis://redis:6379
      CI_REDIS_PASSWORD_FILE: /run/secrets/cloudislands_redis_password
      CI_STORAGE_TYPE: S3
      CI_STORAGE_ENDPOINT: http://minio:9000
      CI_STORAGE_BUCKET: cloudislands
      CI_STORAGE_ACCESS_KEY_FILE: /run/secrets/cloudislands_storage_access_key
      CI_STORAGE_SECRET_KEY_FILE: /run/secrets/cloudislands_storage_secret_key
      CI_CORE_TOKEN_FILE: /run/secrets/cloudislands_core_token
      CI_ADMIN_TOKEN_FILE: /run/secrets/cloudislands_admin_token
      JAVA_OPTS: ${CLOUDISLANDS_CORE_JAVA_OPTS:--Xms128m -Xmx768m}
    secrets:
      - cloudislands_database_password
      - cloudislands_redis_password
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
      - cloudislands_core_token
      - cloudislands_admin_token
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  core-api:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    depends_on:
      core-1:
        condition: service_healthy
      core-2:
        condition: service_healthy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - backend
      - edge
    ports:
      - "${CLOUDISLANDS_CORE_API_BIND:-127.0.0.1}:8443:8443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8443/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  velocity:
    image: ${CLOUDISLANDS_VELOCITY_IMAGE:-cloudislands-velocity:local}
    build:
      context: ../..
      dockerfile: deploy/docker/velocity.Dockerfile
      args:
        VELOCITY_VERSION: ${CLOUDISLANDS_VELOCITY_VERSION:-3.5.0-SNAPSHOT}
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      CLOUDISLANDS_CORE_API_BASE_URL: ${CLOUDISLANDS_CORE_API_BASE_URL:-http://core-api:8443}
      JAVA_OPTS: ${CLOUDISLANDS_VELOCITY_JAVA_OPTS:--Xms256m -Xmx1g}
    secrets:
      - cloudislands_core_token
      - cloudislands_admin_token
      - cloudislands_forwarding_secret
    networks:
      - backend
      - edge
    volumes:
      - velocity-data:/data
    ports:
      - "25565:25565"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8788/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  lobby-paper:
    image: ${CLOUDISLANDS_PAPER_IMAGE:-cloudislands-paper:local}
    build:
      context: ../..
      dockerfile: deploy/docker/paper.Dockerfile
      args:
        PAPER_VERSION: ${CLOUDISLANDS_PAPER_VERSION:-26.1.2}
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      EULA: ${MINECRAFT_EULA:?set MINECRAFT_EULA=TRUE after accepting the Minecraft EULA}
      CLOUDISLANDS_NODE_ID: lobby-01
      CLOUDISLANDS_NODE_ROLE: LOBBY
      CLOUDISLANDS_NODE_POOL: lobby
      CLOUDISLANDS_VELOCITY_SERVER_NAME: lobby
      CLOUDISLANDS_CORE_API_BASE_URL: ${CLOUDISLANDS_CORE_API_BASE_URL:-http://core-api:8443}
      CLOUDISLANDS_STORAGE_ENDPOINT: http://minio:9000
      JAVA_OPTS: ${CLOUDISLANDS_LOBBY_JAVA_OPTS:--Xms512m -Xmx1g}
    secrets:
      - cloudislands_core_token
      - cloudislands_admin_token
      - cloudislands_forwarding_secret
      - cloudislands_redis_password
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
    networks:
      - backend
      - egress
    volumes:
      - lobby-paper-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8789/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s

  island-paper-a:
    image: ${CLOUDISLANDS_PAPER_IMAGE:-cloudislands-paper:local}
    build:
      context: ../..
      dockerfile: deploy/docker/paper.Dockerfile
      args:
        PAPER_VERSION: ${CLOUDISLANDS_PAPER_VERSION:-26.1.2}
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      EULA: ${MINECRAFT_EULA:?set MINECRAFT_EULA=TRUE after accepting the Minecraft EULA}
      CLOUDISLANDS_NODE_ID: island-a
      CLOUDISLANDS_NODE_ROLE: ISLAND_NODE
      CLOUDISLANDS_NODE_POOL: island
      CLOUDISLANDS_VELOCITY_SERVER_NAME: island-a
      CLOUDISLANDS_CORE_API_BASE_URL: ${CLOUDISLANDS_CORE_API_BASE_URL:-http://core-api:8443}
      CLOUDISLANDS_STORAGE_ENDPOINT: http://minio:9000
      JAVA_OPTS: ${CLOUDISLANDS_ISLAND_A_JAVA_OPTS:--Xms512m -Xmx1g}
    secrets:
      - cloudislands_core_token
      - cloudislands_admin_token
      - cloudislands_forwarding_secret
      - cloudislands_redis_password
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
    networks:
      - backend
      - egress
    volumes:
      - island-paper-a-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8789/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s

  island-paper-b:
    image: ${CLOUDISLANDS_PAPER_IMAGE:-cloudislands-paper:local}
    build:
      context: ../..
      dockerfile: deploy/docker/paper.Dockerfile
      args:
        PAPER_VERSION: ${CLOUDISLANDS_PAPER_VERSION:-26.1.2}
    restart: unless-stopped
    depends_on:
      velocity:
        condition: service_healthy
      core-api:
        condition: service_healthy
    environment:
      EULA: ${MINECRAFT_EULA:?set MINECRAFT_EULA=TRUE after accepting the Minecraft EULA}
      CLOUDISLANDS_NODE_ID: island-b
      CLOUDISLANDS_NODE_ROLE: ISLAND_NODE
      CLOUDISLANDS_NODE_POOL: island
      CLOUDISLANDS_VELOCITY_SERVER_NAME: island-b
      CLOUDISLANDS_CORE_API_BASE_URL: ${CLOUDISLANDS_CORE_API_BASE_URL:-http://core-api:8443}
      CLOUDISLANDS_STORAGE_ENDPOINT: http://minio:9000
      JAVA_OPTS: ${CLOUDISLANDS_ISLAND_B_JAVA_OPTS:--Xms512m -Xmx1g}
    secrets:
      - cloudislands_core_token
      - cloudislands_admin_token
      - cloudislands_forwarding_secret
      - cloudislands_redis_password
      - cloudislands_storage_access_key
      - cloudislands_storage_secret_key
    networks:
      - backend
      - egress
    volumes:
      - island-paper-b-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8789/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s

secrets:
  cloudislands_database_password:
    file: ${CLOUDISLANDS_DATABASE_PASSWORD_FILE:?set CLOUDISLANDS_DATABASE_PASSWORD_FILE}
  cloudislands_redis_password:
    file: ${CLOUDISLANDS_REDIS_PASSWORD_FILE:?set CLOUDISLANDS_REDIS_PASSWORD_FILE}
  cloudislands_storage_access_key:
    file: ${CLOUDISLANDS_STORAGE_ACCESS_KEY_FILE:?set CLOUDISLANDS_STORAGE_ACCESS_KEY_FILE}
  cloudislands_storage_secret_key:
    file: ${CLOUDISLANDS_STORAGE_SECRET_KEY_FILE:?set CLOUDISLANDS_STORAGE_SECRET_KEY_FILE}
  cloudislands_core_token:
    file: ${CLOUDISLANDS_CORE_TOKEN_FILE:?set CLOUDISLANDS_CORE_TOKEN_FILE}
  cloudislands_admin_token:
    file: ${CLOUDISLANDS_ADMIN_TOKEN_FILE:?set CLOUDISLANDS_ADMIN_TOKEN_FILE}
  cloudislands_forwarding_secret:
    file: ${CLOUDISLANDS_FORWARDING_SECRET_FILE:?set CLOUDISLANDS_FORWARDING_SECRET_FILE}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  velocity-data:
  lobby-paper-data:
  island-paper-a-data:
  island-paper-b-data:

networks:
  backend:
    internal: true
  edge:
  egress:
