name: cloudislands-single-paper

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudislands
      POSTGRES_USER: cloudislands
      POSTGRES_PASSWORD_FILE: /run/secrets/cloudislands_database_password
    secrets:
      - cloudislands_database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudislands -d cloudislands"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  core:
    build:
      context: ../../..
      dockerfile: deploy/docker/core.Dockerfile
    image: cloudislands-core:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CI_RUNTIME_MODE: single-paper-production
      CI_BIND: 0.0.0.0
      CI_PORT: "8443"
      CI_ALLOW_INSECURE_PUBLIC_HTTP: "true"
      CI_AUTH_MODE: TOKEN_REQUIRED
      CI_REQUIRE_MTLS: "false"
      CI_REPOSITORY_MODE: JDBC
      CI_DATABASE_TYPE: POSTGRESQL
      CI_JDBC_URL: jdbc:postgresql://postgres:5432/cloudislands
      CI_DB_USERNAME: cloudislands
      CI_DB_PASSWORD_FILE: /run/secrets/cloudislands_database_password
      CI_DB_AUTO_SCHEMA: "true"
      CI_DB_FALLBACK_ENABLED: "false"
      CI_JOB_QUEUE_MODE: REDIS
      CI_EVENT_BUS_MODE: REDIS
      CI_REDIS_URI: redis://redis:6379
      CI_STORAGE_TYPE: LOCAL_FILESYSTEM
      CI_STORAGE_LOCAL_PATH: /data/islands-storage
      CI_CORE_TOKEN_FILE: /run/secrets/cloudislands_core_token
      CI_ADMIN_TOKEN_FILE: /run/secrets/cloudislands_admin_token
      CI_ADMIN_LISTENER_ENABLED: "false"
      CI_PUBLIC_ADMIN_API_ENABLED: "false"
      CI_ADMIN_PERMISSIONS: ${CI_ADMIN_PERMISSIONS:-audit-read}
    secrets:
      - cloudislands_database_password
      - cloudislands_core_token
      - cloudislands_admin_token
    volumes:
      - ${CLOUDISLANDS_STORAGE_PATH:?set CLOUDISLANDS_STORAGE_PATH to the Paper local storage directory}:/data/islands-storage
    networks:
      - backend
      - edge
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8443/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

secrets:
  cloudislands_database_password:
    file: ${CLOUDISLANDS_DATABASE_PASSWORD_FILE:-./secrets/database-password}
  cloudislands_core_token:
    file: ${CLOUDISLANDS_CORE_TOKEN_FILE:-./secrets/core-token}
  cloudislands_admin_token:
    file: ${CLOUDISLANDS_ADMIN_TOKEN_FILE:-./secrets/admin-token}

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    internal: true
  edge:
