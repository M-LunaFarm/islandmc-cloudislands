# 설정 형식 버전입니다. 플러그인이 자동 관리하므로 2를 유지하세요.
config-version: 2
# BASIC은 이 파일만 수정하는 일반 사용자 모드, ADVANCED는 분리된 설정을 직접 다루는 전문가 모드입니다.
configuration-mode: BASIC
# BASIC 모드에서 필요한 핵심 연결 설정입니다.
basic:
  # Core 서비스 주소입니다. 같은 컴퓨터이면 아래 기본값, 다른 컴퓨터이면 해당 서버 IP를 입력하세요.
  core-url: http://127.0.0.1:8443
  # 섬 이동 실패 또는 서버 종료 때 보낼 velocity.toml [servers]의 로비 이름입니다.
  fallback-server: Lobby
  # Core가 섬 서버를 선택할 때 사용할 노드 풀 이름입니다. Paper runtime.yml의 node.pool과 맞추세요.
  island-pool: island
# 배포 도구가 읽는 설정 프로필 이름입니다. 일반 설치에서는 basic을 유지하세요.
profile: basic
# 기본 메시지 언어입니다. 한국어는 ko_kr, 영어는 en_us를 입력하세요.
language: ko_kr
# 중복 키나 위험한 평문 비밀 값을 시작 전에 차단합니다. true를 권장합니다.
strict-validation: true
# ADVANCED 모드에서 사용하는 분리 설정 파일 경로입니다. 파일을 옮기지 않았다면 수정하지 마세요.
files:
  # Core API 주소와 요청 시간 제한 설정 파일입니다.
  core-api: core-api.yml
  # 로비·섬 풀·라우팅 티켓 설정 파일입니다.
  routing: routing.yml
  # API 토큰·Velocity forwarding 보안 설정 파일입니다. 이전 문서의 auth.yml 역할입니다.
  security: security.yml
  # 사용자·관리자 명령어 별칭 설정 파일입니다.
  commands: commands.yml
  # 모니터링용 상태 HTTP 서버 설정 파일입니다.
  health: health.yml
  # 현재 언어의 메시지 설정 파일입니다.
  locale: messages/ko_kr.yml
