core-api:
  auth-token: "${file:/run/secrets/cloudislands_core_token}"
  admin-token: "${file:/run/secrets/cloudislands_admin_token}"
forwarding:
  require-modern: true
  # Leave blank to reuse velocity.toml's forwarding-secret-file automatically.
  # If it does not exist, Java SecureRandom creates it on Windows and Linux.
  secret: ""
  secret-file: ""
  auto-generate: true
plugin-message:
  block-cloudislands-channel: true
