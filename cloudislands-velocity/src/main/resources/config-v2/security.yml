# Core API 요청에 사용하는 인증 토큰 설정입니다.
core-api:
  # 일반 API 토큰 파일입니다. 상대 경로는 config-v2 폴더 기준이며 Core/Paper와 같은 값을 사용하세요.
  auth-token: "${file:../secrets/core-token}"
  # 관리자 API 토큰 파일입니다. 일반 토큰과 서로 다른 값을 권장합니다.
  admin-token: "${file:../secrets/admin-token}"
  # true이면 파일이 없을 때 Java SecureRandom으로 Windows/Linux 공용 256비트 토큰을 생성합니다.
  auto-generate-tokens: true
# Velocity modern forwarding 보안 설정입니다.
forwarding:
  # true이면 안전하지 않은 legacy forwarding 구성을 거부하고 modern 방식을 요구합니다.
  require-modern: true
  # 직접 비밀 참조를 지정할 수 있습니다. 빈 값이면 velocity.toml의 forwarding-secret-file을 재사용합니다.
  secret: ""
  # velocity.toml과 다른 파일을 쓸 때만 서버 루트 기준 경로를 입력하세요.
  secret-file: ""
  # true이면 forwarding 비밀 파일이 없을 때 Java SecureRandom으로 자동 생성합니다.
  auto-generate: true
# 백엔드 Paper가 보낸 플러그인 메시지의 신뢰 범위를 제한합니다.
plugin-message:
  # true이면 백엔드가 CloudIslands 제어 채널을 위조하지 못하게 차단합니다.
  block-cloudislands-channel: true
