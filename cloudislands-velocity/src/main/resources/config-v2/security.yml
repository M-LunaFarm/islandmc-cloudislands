core-api:
  # Relative file references are resolved from this config-v2 directory.
  # BASIC mode creates both files with Java SecureRandom on Windows and Linux.
  auth-token: "${file:../secrets/core-token}"
  admin-token: "${file:../secrets/admin-token}"
  auto-generate-tokens: true
forwarding:
  require-modern: true
  # Leave blank to reuse velocity.toml's forwarding-secret-file automatically.
  # If it does not exist, Java SecureRandom creates it on Windows and Linux.
  secret: ""
  secret-file: ""
  auto-generate: true
plugin-message:
  block-cloudislands-channel: true
