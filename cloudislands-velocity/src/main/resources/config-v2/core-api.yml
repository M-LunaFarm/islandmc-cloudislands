# Core API 연동을 사용할지 정합니다. CloudIslands 네트워크에서는 true가 필요합니다.
enabled: true
# Core 서비스 주소입니다. 같은 컴퓨터라면 http://127.0.0.1:8443을 사용할 수 있습니다.
base-url: http://127.0.0.1:8443
# Core 연결과 전체 요청의 최대 대기 시간 설정입니다.
timeout:
  # TCP 연결이 성립될 때까지 기다릴 시간입니다.
  connect: 2s
  # 연결 후 API 응답 전체를 기다릴 시간입니다.
  request: 3s
