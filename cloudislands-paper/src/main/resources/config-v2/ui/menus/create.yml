id: island.create
rows: 3
title-key: menu.create.title
layout:
  - "W.......N"
  - "________."
  - "M___R___."
items:
  _:
    material: OAK_SAPLING
    name-key: create-menu-template-name
    fallback-name: 섬 템플릿
    action: create
  M:
    material: COMPASS
    name-key: create-menu-main-menu-name
    fallback-name: 메인 메뉴
    lore-keys:
      - create-menu-main-menu-command
    fallback-lore:
      - "/섬 메뉴"
    action: back
  R:
    material: CLOCK
    name-key: create-menu-refresh-name
    fallback-name: 템플릿 새로고침
    lore-keys:
      - create-menu-refresh-command
    fallback-lore:
      - "/섬 생성메뉴"
    action: open
  W:
    material: ARROW
    name-key: create-menu-previous-page
    fallback-name: 이전 페이지
    action: page
  N:
    material: ARROW
    name-key: create-menu-next-page
    fallback-name: 다음 페이지
    action: page
actions:
  open: island.create.open
  page: island.create.page
  create: island.create.prepare
  back: island.main.open
