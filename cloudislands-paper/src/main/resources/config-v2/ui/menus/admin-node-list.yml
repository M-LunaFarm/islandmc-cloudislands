id: admin.nodes
rows: 6
title-key: admin-node-list-menu-title
layout:
  - "_________"
  - "_________"
  - "_________"
  - "_________"
  - "____E____"
  - "P..R.X..N"
items:
  _:
    material: NETHER_STAR
    name-key: admin-node-list-menu-entry-name
    fallback-name: 섬 노드
    action: entry
  E:
    material: RED_DYE
    name-key: admin-node-list-menu-empty-name
    fallback-name: 등록된 노드가 없습니다
  P:
    material: ARROW
    name-key: admin-node-list-menu-previous-name
    fallback-name: 이전 페이지
    action: page
  R:
    material: CLOCK
    name-key: admin-node-list-menu-refresh-name
    fallback-name: 새로고침
    action: refresh
  X:
    material: OAK_DOOR
    name-key: admin-menu-close-name
    fallback-name: 닫기
    action: close
  N:
    material: ARROW
    name-key: admin-node-list-menu-next-name
    fallback-name: 다음 페이지
    action: page
actions:
  entry: admin.node.open
  page: admin.node.page
  refresh: admin.node.page
  close: gui.close
