id: admin.dashboard
rows: 5
title-key: admin-dashboard-menu-title
layout:
  - "........."
  - ".N.J.R.S."
  - ".E.A.M.V."
  - "..DGT...."
  - "...B.X..."
items:
  N:
    material: RECOVERY_COMPASS
    name-key: admin-dashboard-menu-nodes-name
    fallback-name: 노드 관리
    lore-keys:
      - admin-dashboard-menu-nodes-lore
    fallback-lore:
      - "노드 상태와 안전 작업"
    action: nodes
  J:
    material: PAPER
    name-key: admin-dashboard-menu-jobs-name
    fallback-name: 작업 큐
    lore-keys:
      - admin-dashboard-menu-jobs-lore
    fallback-lore:
      - "실패 작업 재시도와 취소"
    action: jobs
  R:
    material: ENDER_EYE
    name-key: admin-dashboard-menu-routes-name
    fallback-name: 라우트 관리
    lore-keys:
      - admin-dashboard-menu-routes-lore
    fallback-lore:
      - "플레이어 세션과 이동 티켓"
    action: routes
  S:
    material: CHEST
    name-key: admin-dashboard-menu-storage-name
    fallback-name: 스토리지 상태
    lore-keys:
      - admin-dashboard-menu-storage-lore
    fallback-lore:
      - "저장소 가용성과 실패 현황"
    action: storage
  E:
    material: REDSTONE_TORCH
    name-key: admin-dashboard-menu-events-name
    fallback-name: Core 이벤트
    lore-keys:
      - admin-dashboard-menu-events-lore
    fallback-lore:
      - "최신 런타임 이벤트 스트림"
    action: events
  A:
    material: WRITABLE_BOOK
    name-key: admin-dashboard-menu-audit-name
    fallback-name: 감사 로그
    lore-keys:
      - admin-dashboard-menu-audit-lore
    fallback-lore:
      - "관리 작업 실행 기록"
    action: audit
  M:
    material: COMPARATOR
    name-key: admin-dashboard-menu-metrics-name
    fallback-name: Core 메트릭
    lore-keys:
      - admin-dashboard-menu-metrics-lore
    fallback-lore:
      - "핵심 운영 지표 대시보드"
    action: metrics
  V:
    material: BOOK
    name-key: admin-dashboard-menu-reviews-name
    fallback-name: 후기 신고
    lore-keys:
      - admin-dashboard-menu-reviews-lore
    fallback-lore:
      - "신고된 후기 검토와 처리"
    action: reviews
  D:
    material: JIGSAW
    name-key: admin-dashboard-menu-addons-name
    fallback-name: Addon 관리
    lore-keys:
      - admin-dashboard-menu-addons-lore
    fallback-lore:
      - "등록 Addon 상태와 기능 가용성"
    action: addons
  G:
    material: STRUCTURE_BLOCK
    name-key: admin-dashboard-menu-migration-name
    fallback-name: 마이그레이션
    lore-keys:
      - admin-dashboard-menu-migration-lore
    fallback-lore:
      - "SuperiorSkyblock2 이전 상태와 작업"
    action: migration
  T:
    material: STRUCTURE_BLOCK
    name-key: admin-dashboard-menu-templates-name
    fallback-name: 섬 템플릿
    lore-keys:
      - admin-dashboard-menu-templates-lore
    fallback-lore:
      - "생성 템플릿 상태와 가용성"
    action: templates
  B:
    material: NETHER_STAR
    name-key: admin-dashboard-menu-main-name
    fallback-name: 섬 메뉴로 돌아가기
    action: main
  X:
    material: OAK_DOOR
    name-key: admin-menu-close-name
    fallback-name: 닫기
    action: close
actions:
  addons: admin.addons.open
  nodes: admin.node.list
  jobs: admin.jobs.open
  routes: admin.route.open
  storage: admin.storage.open
  events: admin.events.open
  audit: admin.audit.open
  metrics: admin.metrics.open
  reviews: admin.reviews.open
  migration: admin.migration.open
  templates: admin.templates.open
  main: island.main.open
  close: gui.close
