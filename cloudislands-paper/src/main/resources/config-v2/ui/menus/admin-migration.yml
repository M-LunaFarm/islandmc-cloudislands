id: admin.migration
rows: 3
title-key: admin-migration-menu-title
layout:
  - "....H...."
  - ".SDAIVP.."
  - ".R......X"
items:
  H:
    material: COMPASS
    name-key: admin-migration-menu-status-name
    fallback-name: 현재 마이그레이션 상태
    action: status
  S:
    material: MAP
    name-key: admin-migration-menu-scan-name
    fallback-name: 스캔
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 scan"
    action: scan
  D:
    material: PAPER
    name-key: admin-migration-menu-dryrun-name
    fallback-name: Dry-run
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 dryrun"
    action: dryrun
  A:
    material: LIME_DYE
    name-key: admin-migration-menu-approve-name
    fallback-name: 승인
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 approve <approvalToken>"
    action: approve
  I:
    material: MINECART
    name-key: admin-migration-menu-import-name
    fallback-name: 승인 토큰으로 가져오기
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 import <approvalToken>"
    action: import
  V:
    material: EMERALD
    name-key: admin-migration-menu-verify-name
    fallback-name: 검증
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 verify"
    action: verify
  P:
    material: BOOK
    name-key: admin-migration-menu-rollback-plan-name
    fallback-name: 롤백 계획
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 rollback-plan"
    action: rollback-plan
  R:
    material: REDSTONE_BLOCK
    name-key: admin-migration-menu-rollback-name
    fallback-name: 롤백
    fallback-lore:
      - "/ciadmin migrate-superiorskyblock2 rollback"
    action: rollback
  X:
    material: OAK_DOOR
    name-key: admin-menu-close-name
    fallback-name: 닫기
    action: close
actions:
  status: admin.migration.open
  scan: admin.migration.scan
  dryrun: admin.migration.dryrun
  approve: admin.migration.approve.prompt
  import: admin.migration.import.prompt
  verify: admin.migration.verify
  rollback-plan: admin.migration.rollback-plan
  rollback: admin.migration.rollback.prompt
  close: gui.close
