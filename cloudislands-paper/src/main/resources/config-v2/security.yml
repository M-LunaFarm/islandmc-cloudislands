core-api:
  auth-token: "${file:/run/secrets/cloudislands_core_token}"
  admin-token: "${file:/run/secrets/cloudislands_admin_token}"
redis:
  password: "${file:/run/secrets/redis_password}"
storage:
  access-key: "${file:/run/secrets/s3_access_key}"
  secret-key: "${file:/run/secrets/s3_secret_key}"
  bearer-token: "${file:/run/secrets/s3_bearer_token}"
forwarding:
  required: true
  # Leave blank to reuse proxies.velocity.secret from paper-global.yml.
  # VELOCITY_FORWARDING_SECRET remains available for managed deployments.
  secret: ""
route-session:
  enforce: true
  required: true
trusted-proxies: []
proxy-source-allowlist:
  required: true
admin-command-dispatch:
  enabled: false
